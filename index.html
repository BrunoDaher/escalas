<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

        <title>Bruno Coelho - Escalas</title>    
        <link rel="stylesheet" href='css/style.css'>    
        <link href="./css/fontes/fontemus.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css">
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        
    </head>

    <body style="overflow-y: hidden;"> 

        <article id="messenger" class="off f2vh rad1">
        </article>

        <!-- tira o justCenter e devolve o flex -->
        <header id="header" >

            <div ic="headerContainer" class="itemCenter p-2">
                

            <div id="wellcome" class="off justContBetween flex itemCenter" style="gap:0"> 
               
                <div class="flex itemCenter">
                    <img class="coelho" src="./img/ico/coelho0.png" alt="" srcset="">
                    <div class="grid filterB" style="position: relative;">
                        <a class="colorB">Virtuaguitar</a> 
                        <small  id="usuarioInfo" style="bottom: -7px;">
                            <small id="userInfo" >
                            </small>
                        </small>
                    </div>  
                </div>
                
                  <menu  id="hMenu" class="" style=" margin-right: 3vw;" >  
            
            </div>
                
               
            </div>

          
                
            <section id="enter" class="grid selfCenter filterB">

                                        
                <img class="coelho"  src="./img/ico/coelho0.png" alt="" srcset="">
                    <a class="colorB">Virtuaguitar</a> 
                <div id="dataEnter"></div>

            </section>
        
             


        </header>

            <article id="nav">
            </article>
            
            <div id="platforms" 
                    class="gridCenter off" 
                    style="margin-top: 10vh;">
                    
                    <div class="t1 bi  m-2">
                        Disponível para mac e windows
                    </div>

                    <div class="t3 flex" style="place-content: center;">
                        <i class="bi-apple"></i> <i class="bi-microsoft"></i>
                    </div>
            </div>

        <footer  id="footer" class="off"  style="z-index: 10;">
            <nav id="navegacao" class="flex justContBetween">
            </nav>
        </footer>            

        <!--terceiros-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
   
        <!--supabase-->
        <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <!--App-->
        <script type="module" src="js/inicio.mjs">
        </script>

    </body>
</html>
